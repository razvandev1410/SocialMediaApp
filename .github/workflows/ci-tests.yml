name: CI Tests

on:
  push:
  pull_request:

jobs:
  java-unit-tests:
    name: Java Unit Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SocialMediaAppBackend/demo
    steps:
      - name: Checkout repository
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run Maven unit tests
        continue-on-error: true
        run: mvn clean test -pl . -Dtest="com.example.demo.service.*Test" - DfailIfNoTests=false

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SocialMediaAppFrontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SocialMediaAppFrontend/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        continue-on-error: true
        run: npm run build