name: Lint & Code Quality
 
on:
  push:
  pull_request:
 
jobs:
  backend-lint:
    name: Backend Code Quality (Checkstyle)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SocialMediaAppBackend/demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
 
      - name: Run Checkstyle
        continue-on-error: true
        run: mvn checkstyle:check -Dcheckstyle.violationSeverity=warning
 
  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SocialMediaAppFrontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SocialMediaAppFrontend/package-lock.json
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run ESLint
        continue-on-error: true
        run: npx eslint src/ --ext .ts,.tsx
